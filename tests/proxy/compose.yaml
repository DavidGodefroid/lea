name: lea-proxy-test
networks:
  pub:  { internal: true, ipam: { config: [ { subnet: 198.51.100.0/24 } ] } }
  priv: { internal: true, ipam: { config: [ { subnet: 10.99.0.0/24 } ] } }
  # The proxy's egress network, as in lea (not internal: the proxy's default route goes there).
  egress: { ipam: { config: [ { subnet: 203.0.113.0/24 } ] } }
volumes:
  gate-audit:
  gate-status:
x-web: &web
  image: busybox:1.37
  command: sh -c 'mkdir -p /www && echo ok >/www/index.html && httpd -p 22 -h /www && httpd -p 443 -h /www && httpd -f -p 80 -h /www'
services:
  dns:
    build: { context: ., dockerfile_inline: "FROM alpine:3.22\nRUN apk add --no-cache dnsmasq\n" }
    command: [ "dnsmasq", "-k", "-C", "/etc/dnsmasq.conf" ]
    volumes: [ "./dnsmasq.conf:/etc/dnsmasq.conf:ro" ]
    networks: { pub: { ipv4_address: 198.51.100.53 } }
  public-web:   { <<: *web, networks: { pub:  { ipv4_address: 198.51.100.80 } } }
  internal-web: { <<: *web, networks: { priv: { ipv4_address: 10.99.0.80 } } }
  private-web:  { <<: *web, networks: { priv: { ipv4_address: 10.99.0.81 } } }
  literal-web:  { <<: *web, networks: { priv: { ipv4_address: 10.99.0.82 } } }
  # A shared ingress: one TLS port for every vhost (openssl serves any SNI).
  ingress:
    build: { context: ., dockerfile_inline: "FROM alpine:3.22\nRUN apk add --no-cache openssl\n" }
    command: [ "sh", "-c", "openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=ingress -keyout /tmp/k -out /tmp/c 2>/dev/null && exec openssl s_server -quiet -accept 443 -cert /tmp/c -key /tmp/k -www" ]
    networks: { priv: { ipv4_address: 10.99.0.83 } }
  # A fake OpenAI-compatible server for the key forwarder, granted by internal-hosts.
  llm:
    build: { context: ., dockerfile_inline: "FROM alpine:3.22\nRUN apk add --no-cache python3\n" }
    command: [ "python3", "/echo.py" ]
    volumes: [ "./echo.py:/echo.py:ro" ]
    networks: { priv: { ipv4_address: 10.99.0.84 } }
  proxy:
    image: lea-proxy:dev
    dns: [ 198.51.100.53 ]
    # '*': no allowlist, the DoH and IP-literal refusals only.
    environment: { LEA_GIT_SSH: "gitlab.com:22 forge.test:443", LEA_EGRESS_ALLOW: "*" }
    volumes:
      - ./internal-hosts:/etc/lea/internal-hosts:ro
      - ./endpoints:/etc/lea/endpoints:ro
      - ./llm.key:/etc/lea/keys/llm:ro
    networks:
      pub:    { ipv4_address: 198.51.100.2 }
      priv:   { ipv4_address: 10.99.0.2 }
      egress: { ipv4_address: 203.0.113.2 }
  # The same proxy with an egress allowlist.
  proxy-allow:
    image: lea-proxy:dev
    dns: [ 198.51.100.53 ]
    environment: { LEA_EGRESS_ALLOW: "public.test" }
    volumes: [ "./internal-hosts:/etc/lea/internal-hosts:ro" ]
    networks:
      pub:  { ipv4_address: 198.51.100.3 }
      priv: { ipv4_address: 10.99.0.3 }
  # The same proxy with lea's default allowlist (LEA_EGRESS_ALLOW unset).
  proxy-default:
    image: lea-proxy:dev
    dns: [ 198.51.100.53 ]
    volumes: [ "./internal-hosts:/etc/lea/internal-hosts:ro" ]
    networks:
      pub:  { ipv4_address: 198.51.100.4 }
      priv: { ipv4_address: 10.99.0.4 }
  # The proxy under LockHTTP: squid behind the gate on the loopback.
  proxy-lockhttp:
    image: lea-proxy:dev
    dns: [ 198.51.100.53 ]
    # The allowlist must be off: the gate decides.
    environment: { LEA_LOCKHTTP: "1", LEA_EGRESS_ALLOW: "public.test", LEA_KEYPROXY_TOKEN: "tok" }
    volumes:
      - ./internal-hosts:/etc/lea/internal-hosts:ro
      - ./endpoints:/etc/lea/endpoints:ro
      - ./llm.key:/etc/lea/keys/llm:ro
      - ./lockhttp-gate:/etc/lockhttp-gate:ro
    # As in lea, the egress network holds the default route (lea-keyproxy refuses it).
    networks:
      pub:    { ipv4_address: 198.51.100.5 }
      priv:   { ipv4_address: 10.99.0.5 }
      egress: { ipv4_address: 203.0.113.5 }
  # A stand-in gate (fakegate) as lea runs the real one: its own container in the proxy's network
  # namespace, as gate (10003, primary group lockhttp-clients 10020, as in lockhttp's image),
  # read-only, no capability.
  lockhttp-gate:
    build:
      context: ../..
      dockerfile_inline: |
        ARG GO_IMAGE=docker.io/library/golang:1.26.9
        FROM $${GO_IMAGE} AS gate
        COPY tests/proxy/fakegate/main.go /src/main.go
        RUN cd /src && go mod init fakegate && CGO_ENABLED=0 go build -o /lockhttp .
        FROM docker.io/library/alpine:3.22
        COPY --from=gate /lockhttp /usr/local/bin/lockhttp
        RUN install -d -m 0700 -o 10003 -g 10020 /var/log/lockhttp && install -d -m 0755 -o 10003 -g 10020 /run/lockhttp-gate
        ENTRYPOINT ["lockhttp"]
    network_mode: "service:proxy-lockhttp"
    depends_on: [ proxy-lockhttp ]
    user: "10003:10020"
    read_only: true
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges ]
    # Its audit and status directories are volumes, as in lea (a read-only root otherwise): they
    # take the image's owner, gate.
    volumes:
      - ./lockhttp-gate:/etc/lockhttp-gate:ro
      - gate-audit:/var/log/lockhttp
      - gate-status:/run/lockhttp-gate
    command: [ gate, --listen, "0.0.0.0:3130", --upstream, "http://127.0.0.1:3128", --profile, default,
               --sources, /etc/lockhttp-gate/sources.json, --audit-dir, /var/log/lockhttp,
               --status-file, /run/lockhttp-gate/status.json ]
  client:
    image: curlimages/curl:8.11.1
    entrypoint: [ "sleep", "3600" ]
    networks: { pub: { ipv4_address: 198.51.100.10 } }
  # A container of the egress network (as the host is): the key forwarder refuses it.
  outsider:
    image: curlimages/curl:8.11.1
    entrypoint: [ "sleep", "3600" ]
    networks: { egress: { ipv4_address: 203.0.113.10 } }

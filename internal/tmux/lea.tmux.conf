# lea's private tmux server (tmux -L lea), written by the lea daemon. tmux reads it when the
# server starts, and the daemon sources it again (source-file) when it connects to a server it did
# not start, so an upgrade applies without a kill-server. Every line is idempotent: sourcing this
# file twice leaves the server as sourcing it once.
# No prefix key: every key goes to the deck or to the agent, so nothing collides with an
# agent's own shortcuts.
set -g prefix None
set -g prefix2 None
# The layout is lea's: every key table is emptied (tmux's default mouse bindings live in the root
# table: right-click menus with split, swap, kill, respawn and zoom, border drags, double and
# triple clicks, status bar clicks), then only the bindings below are added back. -q: a table
# emptied by an earlier source no longer exists.
unbind-key -aq -T prefix
unbind-key -aq -T root
unbind-key -aq -T copy-mode
unbind-key -aq -T copy-mode-vi
set -g status off
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 10000
# No pane gets the alternate screen. abduco, which keeps every agent and shell alive, switches
# its terminal to it when it attaches (\e[?1049h), and tmux keeps no history for the alternate
# screen: the wheel then had nothing to scroll, and Claude Code's conversation was out of reach.
# On the normal screen it stays in the pane's history. A full-screen program (vim, less, the
# deck) draws on the normal screen instead and leaves its last screen in the history.
set -g alternate-screen off
set -g default-terminal tmux-256color
# An indexed entry, not -a: sourcing the file again must not append a second copy.
set -s terminal-features[50] '*:RGB'
# Hyperlinks (OSC 8) reach the user's terminal, which then opens the whole link wherever it is
# clicked: a long link (Claude Code's /login one) wraps over several rows of the pane, beside the
# deck, where the terminal's own URL detection sees only the piece on each row. Agents emit them:
# the daemon sets FORCE_HYPERLINK=1 in their terminals. tmux before 3.4 has no hyperlinks and
# ignores the feature.
set -s terminal-features[51] '*:hyperlinks'
# Claude Code never asks for extended keys: force them on every pane, in the CSI u form it reads,
# so shift+enter (new line) and other modified keys stay distinct from their plain key.
# extended-keys-format exists from tmux 3.5 (-q: older versions skip it).
set -s extended-keys always
set -sq extended-keys-format csi-u
set-environment -g COLORTERM truecolor
# Panes stay after their process exits: the daemon reattaches a live agent in place, or keeps
# an ended agent's last screen until it is stopped from the deck.
set -g remain-on-exit on
# An agent's dead pane says how to remove it: the daemon sets that line on agent panes only, so a
# dead deck or placeholder keeps tmux's own. -u drops the global line an older lea set.
# remain-on-exit-format exists from tmux 3.3 (-q: older versions have none to drop).
set -gqu remain-on-exit-format
set -g window-size latest
set -g automatic-rename off
set -g allow-rename off
# Agents reach neither the host clipboard nor the outer terminal through escape sequences.
set -g set-clipboard off
set -g pane-border-lines single
set -g pane-border-style 'fg=#585b70'
# The focus shows as the deck's own frame (blue while it has the keyboard) and a darker
# background on the pane without it: the separator stays one plain colour, where tmux would
# colour half of it.
set -g pane-active-border-style 'fg=#585b70'
set -g window-style 'bg=#181825'
set -g window-active-style 'bg=default'
# The terminal on the right says whether it has the keyboard, in a bar on its top border: blue
# "typing here" while it has it, a grey hint while the deck has it (the deck's frame is then
# blue). The deck's own border shows nothing (its frame says it), nor does the empty slot's.
# Scrolled back into the history, the bar says so instead of "typing here", with where the view is
# in the conversation: the line at its top out of the history's lines, counting down as it goes up
# (tmux's own indicator, hidden by copy-mode -H, counted the lines scrolled up from the bottom).
set -g pane-border-status top
set -g pane-border-format '#{?#{||:#{@lea_agent},#{@lea_shell}},#{?pane_active,#[fg=#1e1e2e#,bg=#89b4fa#,bold] ▶ #{?#{@lea_agent},#{@lea_agent},#{@lea_shell}}#{?pane_in_mode, · history #{e|-:#{history_size},#{scroll_position}}/#{history_size}: type or q to go back, · typing here} · ctrl+space: list #[default],#[fg=#a6adc8] #{?#{@lea_agent},#{@lea_agent},#{@lea_shell}}#{?pane_in_mode, · history #{e|-:#{history_size},#{scroll_position}}/#{history_size},} · enter or ctrl+space: type here #[default]},}'
# ctrl+space moves the keyboard between the deck (left) and the agent (right).
bind-key -n C-Space if-shell -F '#{pane_at_left}' 'select-pane -R' 'select-pane -L'
# ctrl+v pastes the host clipboard's text into the pane that has the keyboard (an agent, a shell or
# the deck), as the terminal's own paste does: tmux runs on the host and reads the clipboard
# (wl-paste on Wayland, xclip on X11, pbpaste on macOS) only when the user presses the key; an
# agent still never reads it. The text goes through a file next to the server's socket (its
# directory is the user's alone), into a buffer pasted with bracketed paste and dropped; at most
# 1 MiB. The command always succeeds: a failure would put the pane into view mode. An empty or
# non-text clipboard pastes nothing.
bind-key -n C-v run-shell 'umask 077; f="#{socket_path}.paste"; { if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-paste >/dev/null 2>&1; then wl-paste --no-newline --type text; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -out; elif command -v pbpaste >/dev/null 2>&1; then pbpaste; fi; } 2>/dev/null | head -c 1048576 >"$f"; exit 0' \; load-buffer -b lea-paste '#{socket_path}.paste' \; run-shell 'rm -f "#{socket_path}.paste"' \; paste-buffer -p -d -b lea-paste
# The mouse. lea never types into a pane (ctrl+v above pastes only what the user copied); the
# one exception is here: send-keys -M passes the user's own mouse event on to the pane under the
# pointer, and send-keys -X runs a copy-mode command (scroll, select, copy, cancel). Neither sends
# any text of lea's.
# A click focuses the clicked pane and reaches the program in it.
bind-key -n MouseDown1Pane select-pane -t = \; send-keys -M
# A right click opens the deck's menu of the row under it; over an agent, it reaches a program
# that asked for the mouse, and does nothing otherwise (tmux's own menus are gone).
bind-key -n MouseDown3Pane select-pane -t = \; if-shell -F '#{||:#{==:#{@lea_role},deck},#{mouse_any_flag}}' 'send-keys -M'
# A ctrl + right click makes a folder in the deck; it goes where a right click goes.
bind-key -n C-MouseDown3Pane select-pane -t = \; if-shell -F '#{||:#{==:#{@lea_role},deck},#{mouse_any_flag}}' 'send-keys -M'
# The wheel goes to a program that asked for the mouse; otherwise it scrolls the pane's history,
# except over the deck, which ignores it: in copy mode the deck would swallow its own keys and
# look frozen.
bind-key -n WheelUpPane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' "if-shell -F '#{!=:#{@lea_role},deck}' 'copy-mode -H -e'"
bind-key -n WheelDownPane send-keys -M
# A drag selects text: it goes to a program that asked for the mouse, or over the
# deck to the deck; otherwise it starts copy mode, and releasing the button copies the selection.
bind-key -n MouseDrag1Pane if-shell -F '#{||:#{||:#{pane_in_mode},#{mouse_any_flag}},#{==:#{@lea_role},deck}}' 'send-keys -M' 'copy-mode -H -M'
# In the history: the wheel scrolls, q, Escape or ctrl+c leaves, a drag selects and releasing it
# copies the selection into the clipboard bridge's FIFO (its path is DataDir/state/clipboard/copy,
# computed as the launcher does), then leaves. timeout: with no bridge reading the FIFO, the copy
# is dropped instead of holding a job open; a symlink in its place is refused, as the bridge does.
# "Copied" shows 1.5 s in a thick bar at the top: a borderless popup, three lines high, the word
# bold and centred.
# tmux (3.5 at least) runs the popup command as it is, without formats: #{client_width} would reach
# the shell unexpanded and %% stay doubled (expr then fails and printf prints "%*s"). The command
# holds neither # nor %: the popup's own width comes from stty, and the word is placed with a
# cursor move, at the middle of the second line.
bind-key -T copy-mode WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 5 scroll-down
bind-key -T copy-mode q send-keys -X cancel
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode C-c send-keys -X cancel
bind-key -T copy-mode MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'f=${XDG_DATA_HOME:-$HOME/.local/share}/lea/state/clipboard/copy; [ -p "$f" ] && [ ! -L "$f" ] && exec timeout 2 cat >"$f"' \; display-popup -B -x 0 -y 0 -w 100% -h 3 -s 'bg=#89b4fa,fg=#1e1e2e' -E 'set -- $(stty size 2>/dev/null); n=$(( (${2:-6} - 6) / 2 + 1 )); printf "\033[2;${n}H\033[1mCopied"; sleep 1.5'
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi C-c send-keys -X cancel
bind-key -T copy-mode-vi MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'f=${XDG_DATA_HOME:-$HOME/.local/share}/lea/state/clipboard/copy; [ -p "$f" ] && [ ! -L "$f" ] && exec timeout 2 cat >"$f"' \; display-popup -B -x 0 -y 0 -w 100% -h 3 -s 'bg=#89b4fa,fg=#1e1e2e' -E 'set -- $(stty size 2>/dev/null); n=$(( (${2:-6} - 6) / 2 + 1 )); printf "\033[2;${n}H\033[1mCopied"; sleep 1.5'
# Typing in the history leaves it: tmux drops a key that is not bound in a copy table, and a pane
# scrolled up a few lines still shows Claude Code's prompt, which then looked frozen. The key
# itself is dropped (lea types nothing into a pane); the next ones reach the program. The line is
# repeated, by lea, for each printable ASCII key but q, and for Space, Enter, BSpace and Tab. Not
# Any: tmux tries it for mouse events and ctrl+space too, which must keep their root bindings.
bind-key -T copy-mode -- @KEY@ send-keys -X cancel
bind-key -T copy-mode-vi -- @KEY@ send-keys -X cancel
# The deck keeps its width when the terminal is resized. window-resized, not client-resized: the
# client hook runs before the window takes its new size, which then spreads over both panes.
# The deck window is the one the daemon marks @lea_deck (never found by its name: an agent's
# window may carry any name), and the deck is its left pane.
set-hook -g window-resized "if-shell -F '#{@lea_deck}' 'resize-pane -t :.0 -x @DECK_WIDTH@'"

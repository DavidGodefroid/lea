name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless: the GitHub OIDC token Sigstore certifies
    strategy:
      matrix:
        include:
          - name: lea
            file: image/Containerfile
          - name: lea-proxy
            file: proxy/Containerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.2
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: LEA_VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/davidgodefroid/${{ matrix.name }}:${{ steps.v.outputs.version }}
            ghcr.io/davidgodefroid/${{ matrix.name }}:latest
      # Signed by digest, never by tag: a tag can be moved, the digest is what was built.
      - env:
          IMAGE: ghcr.io/davidgodefroid/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless: the GitHub OIDC token Sigstore certifies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make go-test-tmux
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: static tmux for the Linux archives
        run: |
          mkdir -p dist-tmux
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load -t "lea-tmux:$arch" -f tools/tmux/Containerfile tools/tmux
            id=$(docker create --platform "linux/$arch" "lea-tmux:$arch")
            docker cp "$id:/out/tmux" "dist-tmux/tmux-$arch"
            docker rm "$id"
          done
      - run: tools/dist.sh "$GITHUB_REF_NAME"
      - uses: sigstore/cosign-installer@v4.1.2
      - run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt dist/checksums.txt.sigstore.json dist/install.sh --title "lea $GITHUB_REF_NAME" --generate-notes

  # Asks lockfamily to rebuild lockfamily.dev/docs with this release's
  # CHANGELOG. docs-dispatch.yml's release trigger does not fire here: a
  # release created with GITHUB_TOKEN starts no workflow. Needs the secret
  # LOCKFAMILY_DOCS_TOKEN (lockfamily#39); without it the step is skipped.
  docs:
    name: docs site
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: dispatch to lockfamily
        env:
          GH_TOKEN: ${{ secrets.LOCKFAMILY_DOCS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::LOCKFAMILY_DOCS_TOKEN not set"; exit 0; fi
          gh api repos/DavidGodefroid/lockfamily/dispatches -f event_type=docs

  # Asks the Homebrew tap (DavidGodefroid/homebrew-tap) to bump the lea
  # formula to this release, once the archives are published and signed: the
  # tap's bump workflow verifies them with cosign before rewriting the
  # formula. Needs the secret TAP_DISPATCH_TOKEN, a fine-grained token limited
  # to the tap (Contents: read and write); without it the step is skipped. The
  # token is in this job only, which runs no action.
  tap:
    name: homebrew tap
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    env:
      TAP_DISPATCH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
    steps:
      - name: Bump the Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        if: ${{ env.TAP_DISPATCH_TOKEN != '' }}
        run: |
          gh api repos/DavidGodefroid/homebrew-tap/dispatches \
            -f event_type=bump \
            -f "client_payload[formula]=lea" \
            -f "client_payload[version]=${GITHUB_REF_NAME}"

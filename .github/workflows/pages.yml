name: pages
# The website: site/ (its own assets/), plus the demo and install.sh from the repository root
# (tools/site/assemble.sh), published on GitHub Pages.
# Settings → Pages → Source: "GitHub Actions" once; a custom domain goes in site/CNAME.
on:
  push:
    branches: [main]
    paths: [site/**, assets/demo.svg, install.sh, tools/site/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: sh tools/site/assemble.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

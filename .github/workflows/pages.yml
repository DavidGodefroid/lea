name: pages
# The website: site/ plus the brand assets, published on GitHub Pages.
# Settings → Pages → Source: "GitHub Actions" once; a custom domain goes in site/CNAME.
on:
  push:
    branches: [main]
    paths: [site/**, assets/**, install.sh, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r assets _site/assets
          cp install.sh _site/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

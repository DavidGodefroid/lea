name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: build for every release platform
        run: for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/lea; done
      # The tests in a container with the tmux lea is tested against (the runner's is older).
      - run: make go-test-tmux
  # The proxy rules and the key forwarder lea-keyproxy (tests/proxy): fake DNS, decoy servers and a
  # fake LLM upstream on internal networks; no secret, nothing real is contacted.
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make test-proxy
  # Load-aware admission (#132) on a real engine: a 64 MiB, half-CPU container under a real memory
  # then CPU load; the daemon's sampler reads its cgroup from the host. Docker, and rootless Podman.
  pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make test-pressure ENGINE=${{ matrix.engine }}
  # lea-ctl (#165): lea in its control container on a real engine; the agent container it starts
  # never sees the Docker socket.
  ctl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o build/lea ./cmd/lea
      - run: make build
      - name: AppArmor profile (as lea init loads it)
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - run: make test-ctl
  # The real Codex CLI (the image's pinned version) against a fake upstream through lea-keyproxy.
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install -g --ignore-scripts "@openai/codex@$(sed -n 's/^ARG CODEX_VERSION=//p' image/Containerfile)"
      - run: LEA_E2E_CODEX="$(command -v codex)" go test -count=1 -run 'TestCodex(ReachesAnEndpointThroughTheForwarder|IgnoresAPlantedProjectConfig|LockCallOutlivesTheDefaultToolTimeout)' -v ./internal/providers/
  # The agent-side isolation (tests/integration/isolation.sh, I2/I11): from inside a real lea, no
  # decoy, host port or sibling lea is reachable, .lockfamily is read-only (EROFS) and the hub's
  # facade socket is not visible. The two images come from the GitHub Actions cache when unchanged.
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o build/lea ./cmd/lea
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: proxy/Containerfile
          tags: lea-proxy:dev
          load: true
          cache-from: type=gha,scope=lea-proxy-dev
          cache-to: type=gha,scope=lea-proxy-dev,mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Containerfile
          build-args: LEA_VERSION=dev
          tags: lea:dev
          load: true
          cache-from: type=gha,scope=lea-dev
          cache-to: type=gha,scope=lea-dev,mode=max
      - name: AppArmor profile (as lea init loads it)
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - name: make test-isolation, every check run
        shell: bash
        run: |
          make test-isolation 2>&1 | tee isolation.log
          if grep -E '^FAIL |^note: ' isolation.log; then echo "an isolation check failed or was skipped" >&2; exit 1; fi
          for c in '.lockfamily write gets EROFS' 'host facade socket not visible' 'no facade socket in the container' 'sibling lea unreachable directly' 'host port unreachable via host IP' 'public HTTPS works through the proxy' 'nested HTTP between containers is direct'; do
            grep -qxF "ok   $c" isolation.log || { echo "isolation: '$c' did not run" >&2; exit 1; }
          done
  # The phase-2 exit demo, lea's side (tests/integration/hubdeck.sh): lox up with the released,
  # cosign-verified lockhub and a LockHTTP lock; the gate holds an agent's write, lea's deck
  # approves its ticket through the real facade socket, and the gate lets the write out.
  hubdeck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1
      - name: make test-hubdeck, the deck's test run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make test-hubdeck 2>&1 | tee hubdeck.log
          grep -q -- '^--- PASS: TestHubDeckApprovesARealLockhubTicket ' hubdeck.log
          grep -qx 'hubdeck: OK' hubdeck.log
  # lea's first run on a machine without images (tests/integration/firstrun.sh): a fresh HOME and
  # XDG_* directories, no lea images, the lox CLI of the checksum-verified lockhub release on
  # PATH; `lea shell -- true` pulls both release images (cosign-verified), starts the hub with
  # `lox init`, and a second run pulls nothing and starts no hub. The lox release is the plan's
  # 0.5.0: until lockhub's v0.5.0 is tagged the first step finds no release, every other step is
  # skipped and the job succeeds with a notice; once it exists the test runs with no soft-fail.
  firstrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCKHUB_VERSION: "0.5.0"
    steps:
      - name: is lockhub's release there yet
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$LOCKHUB_VERSION" -R DavidGodefroid/lockhub >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::lockhub v$LOCKHUB_VERSION not released yet: first-run integration skipped"
          fi
      - if: steps.release.outputs.released == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: steps.release.outputs.released == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - if: steps.release.outputs.released == 'true'
        run: go build -o build/lea ./cmd/lea
      - if: steps.release.outputs.released == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1
      - name: AppArmor profile (as lea init loads it)
        if: steps.release.outputs.released == 'true'
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - name: tests/integration/firstrun.sh
        if: steps.release.outputs.released == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tests/integration/firstrun.sh 2>&1 | tee firstrun.log
          grep -qx 'firstrun: OK' firstrun.log
  # The real Claude Code (the image's pinned version) with lea's hooks on a fake Messages API, and
  # lea's daemon: usage-limit resume, truncated transcripts, and the phase-3 suspend/resume demo
  # (a suspended agent stopped, resumed by its approval or a message). No secret, no real model.
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Its postinstall links the platform binary, as in image/Containerfile.
      - run: npm install -g "@anthropic-ai/claude-code@$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' image/Containerfile)"
      - name: the Claude e2e tests, none skipped
        shell: bash
        # Every TestClaude test; the count below is theirs (add one with each new test).
        run: |
          LEA_E2E_CLAUDE="$(command -v claude)" go test -count=1 -run '^TestClaude' -v ./internal/daemon/ 2>&1 | tee claude-e2e.log
          if grep -- '--- SKIP' claude-e2e.log; then echo "a Claude e2e test was skipped" >&2; exit 1; fi
          grep -q -- '^--- PASS: TestClaudePhase3SuspendResumeEndToEnd ' claude-e2e.log
          grep -q -- '^--- PASS: TestClaudeResumesATruncatedTranscript ' claude-e2e.log
          n=$(grep -c -- '^--- PASS: TestClaude' claude-e2e.log)
          echo "$n Claude e2e tests passed"
          [ "$n" -eq 8 ]
  # The lockmq / lockfile socket wiring (tests/integration/lockhost.sh, phase 0): the lockmq
  # client of the release image/Containerfile pins (sha256-checked) reaches a console's socket
  # through its volume, as lea wires it, with no host account; outsiders and other uids refused.
  lockhost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: make test-lockhost, every check run
        shell: bash
        run: |
          make test-lockhost 2>&1 | tee lockhost.log
          if grep '^FAIL' lockhost.log; then exit 1; fi
          n=$(grep -c '^ok ' lockhost.log)
          echo "$n lockhost checks passed"
          [ "$n" -eq 9 ]
  # The phase-0 exit demo with real consoles (tests/integration/phase0.sh): an agent in a real lea
  # (lea:dev) calls locksql_status, lockmq_status and lockfile_status, each reaching a running
  # console of the release image/Containerfile pins (cosign-verified) that lockhub's released
  # lox up runs, wired as lea wires it. The two lea images come from the GitHub Actions cache
  # when unchanged.
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o build/lea ./cmd/lea
      # cosign 3: lockfile's release signs its images in the new bundle format, which cosign 2
      # does not find; cosign 3 verifies lockmq's and locksql's signatures too.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: proxy/Containerfile
          tags: lea-proxy:dev
          load: true
          cache-from: type=gha,scope=lea-proxy-dev
          cache-to: type=gha,scope=lea-proxy-dev,mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Containerfile
          build-args: LEA_VERSION=dev
          tags: lea:dev
          load: true
          cache-from: type=gha,scope=lea-dev
          cache-to: type=gha,scope=lea-dev,mode=max
      - name: AppArmor profile (as lea init loads it)
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - name: make test-phase0, every check run, the three status calls on running consoles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make test-phase0 2>&1 | tee phase0.log
          if grep '^FAIL' phase0.log; then exit 1; fi
          for t in locksql lockmq lockfile; do
            grep -qx "ok    lea's agent: ${t}_status reaches the running $t console" phase0.log || { echo "phase0: ${t}_status did not reach a running console" >&2; exit 1; }
          done
          n=$(grep -c '^ok ' phase0.log)
          # The hub-only checks wait for each Lock's first hub-only release: a note until then.
          h=$(grep -c '^note: .* the hub-only check is not run' phase0.log || true)
          echo "$n phase0 checks passed, $h hub-only checks not run yet"
          [ $((n + h)) -eq 31 ]
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Containerfile
          push: false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: proxy/Containerfile
          push: false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: image/ctl
          file: image/ctl/Containerfile
          push: false

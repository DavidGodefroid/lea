name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: build for every release platform
        run: for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/lea; done
      # The tests in a container with the tmux lea is tested against (the runner's is older).
      - run: make go-test-tmux
  # The proxy rules and the key forwarder lea-keyproxy (tests/proxy): fake DNS, decoy servers and a
  # fake LLM upstream on internal networks; no secret, nothing real is contacted.
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make test-proxy
  # Host resources (#132) on a real engine, Docker and rootless Podman: load-aware admission (a
  # 64 MiB, half-CPU container under a real memory then CPU load), the limits a running container
  # gets at the next lea and an OOM held inside it, and the CPU budget of heavy jobs.
  pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make test-pressure ENGINE=${{ matrix.engine }}
  # lea-ctl (#165): lea in its control container on a real engine; the agent container it starts
  # never sees the Docker socket.
  ctl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o build/lea ./cmd/lea
      - run: make build
      - name: AppArmor profile (as lea init loads it)
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - run: make test-ctl
  # The real Codex CLI (the image's pinned version) against a fake upstream through lea-keyproxy.
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install -g --ignore-scripts "@openai/codex@$(sed -n 's/^ARG CODEX_VERSION=//p' image/Containerfile)"
      - run: LEA_E2E_CODEX="$(command -v codex)" go test -count=1 -run 'TestCodex(ReachesAnEndpointThroughTheForwarder|IgnoresAPlantedProjectConfig|LockCallOutlivesTheDefaultToolTimeout|PassesTheAgentIdentityToALockServer)' -v ./internal/providers/
  # lea's seccomp profile (#100) is moby's default, vendored and pinned, with lea's reviewed changes
  # (image/seccomp/lea.json, each with its reason): the vendored base must be moby's file at the
  # pinned commit and image/seccomp.json what the generator builds from them. A newer moby default
  # is only reported: moving the pin is a reviewed change.
  seccomp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: the vendored base is moby's default at the pinned commit
        run: |
          src=$(jq -r .base.source image/seccomp/lea.json)
          echo "$src" | grep -Eq '^https://raw\.githubusercontent\.com/moby/profiles/[0-9a-f]{40}/seccomp/default\.json$'
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pinned.json" "$src"
          cmp "$RUNNER_TEMP/pinned.json" image/seccomp/moby-default.json
          [ "$(sha256sum <image/seccomp/moby-default.json | cut -d' ' -f1)" = "$(jq -r .base.sha256 image/seccomp/lea.json)" ]
      - name: image/seccomp.json is what image/seccomp/generate.py builds
        run: python3 -I image/seccomp/generate.py --check
      - name: report a newer moby default (never fails)
        run: |
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/main.json" https://raw.githubusercontent.com/moby/profiles/main/seccomp/default.json \
            && ! cmp -s "$RUNNER_TEMP/main.json" image/seccomp/moby-default.json; then
            echo "::notice title=seccomp::moby/profiles main has a newer seccomp/default.json than the pinned one: review it and move the pin in image/seccomp/lea.json"
          fi
  # The agent-side isolation (tests/integration/isolation.sh, I2/I11): from inside a real lea, no
  # decoy, host port or sibling lea is reachable, .lockfamily is read-only (EROFS) and the hub's
  # facade socket is not visible. The two images come from the GitHub Actions cache when unchanged.
  isolation:
    runs-on: ubuntu-latest
    # actions: read: gh run view --log inside lea (#103), with the workflow's token.
    permissions: { contents: read, actions: read }
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o build/lea ./cmd/lea
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: proxy/Containerfile
          tags: lea-proxy:dev
          load: true
          cache-from: type=gha,scope=lea-proxy-dev
          cache-to: type=gha,scope=lea-proxy-dev,mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Containerfile
          build-args: LEA_VERSION=dev
          tags: lea:dev
          load: true
          cache-from: type=gha,scope=lea-dev
          cache-to: type=gha,scope=lea-dev,mode=max
      - name: AppArmor profile (as lea init loads it)
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - name: make test-isolation, every check run
        shell: bash
        # gh and git in lea with the token in the proxy only (#103): the workflow's own token.
        env:
          LEA_IT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make test-isolation 2>&1 | tee isolation.log
          if grep -E '^FAIL |^note: ' isolation.log; then echo "an isolation check failed or was skipped" >&2; exit 1; fi
          for c in '.lockfamily write gets EROFS' 'host facade socket not visible' 'no facade socket in the container' 'sibling lea unreachable directly' 'host port unreachable via host IP' 'public HTTPS works through the proxy' 'nested HTTP between containers is direct' \
                   'the GitHub token moved to the proxy' 'the GitHub token left the agents'"'"' state' 'no GitHub token readable in /lea/state or ~' \
                   'no copy of the GitHub token readable' 'the GitHub relay runs as nobody' 'gh api works with the token added by the proxy' \
                   "git reaches github.com through the proxy's forwarder" 'gh run view --log follows the redirect to its own host' \
                   "gh: a call off lea's allowlist is refused" "gh: a GraphQL mutation off lea's allowlist is refused" "lea's pinned gh config loads read-only" \
                   'proxy confined: CapDrop' 'proxy confined: ReadonlyRootfs' 'proxy confined: no root process but PID 1' \
                   'a nested image builds' 'a nested container reaches the proxy over pasta' 'unprivileged user namespace (rootless Podman needs it)' \
                   'keyctl refused (seccomp)' 'perf_event_open refused (seccomp)' 'reboot refused (seccomp)' 'vmsplice refused (seccomp)' 'NETLINK_AUDIT socket refused (seccomp)' \
                   'NETLINK_AUDIT socket with high protocol bits refused (seccomp)' 'AF_ALG socket with high family bits refused (seccomp)' \
                   'sudo absent' 'no setuid or setgid file' \
                   "lea-proxy resolves (Docker's embedded resolver)" 'an external name does not resolve (example.com)' 'no direct DNS to 8.8.8.8:53 over udp' 'no direct DNS to 1.1.1.1:53 over tcp' \
                   "DNS exfiltration attempts sent (isolation.sh checks the decoy's log)" 'nested: an external name does not resolve (example.com)' 'nested: no direct DNS to 8.8.8.8:53 over tcp' \
                   "nested: DNS exfiltration attempts sent (isolation.sh checks the decoy's log)" 'no DNS query from inside lea reached the decoy' \
                   'settings.json is a copy of the host'"'"'s' '/permissions adds a rule' '/plugin install works' 'marketplace update works' 'managed settings carry lea'"'"'s hooks' 'permission rules are managed only' 'the host'"'"'s permission rules are managed' 'an agent'"'"'s rule is not managed' 'the host'"'"'s rules are not writable' 'managed settings are not writable' 'host ~/.claude settings.json and plugins unchanged'; do
            grep -qxF "ok   $c" isolation.log || { echo "isolation: '$c' did not run" >&2; exit 1; }
          done
  # Without the deck (LEA_DECK=0, #135), on a real engine: lea runs the user's own tool in the
  # same lea container (its isolation checked from inside), lea attach --print works as is from
  # another terminal, and lea config deck on|off switches with the same container.
  nodeck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o build/lea ./cmd/lea
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: proxy/Containerfile
          tags: lea-proxy:dev
          load: true
          cache-from: type=gha,scope=lea-proxy-dev
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Containerfile
          build-args: LEA_VERSION=dev
          tags: lea:dev
          load: true
          cache-from: type=gha,scope=lea-dev
      - name: tmux for the deck half of the test
        run: command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
      - name: AppArmor profile (as lea init loads it)
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - name: tests/integration/nodeck.sh
        shell: bash
        run: |
          tests/integration/nodeck.sh 2>&1 | tee nodeck.log
          grep -qx 'nodeck: OK' nodeck.log
  # The same isolation checks with the agent container on a sandboxed runtime (#106, LEA_RUNTIME):
  # gVisor (runsc) and Kata Containers (QEMU, the runner's /dev/kvm), each installed at a pinned
  # release by tests/integration/install-runtime.sh. docker inspect must show the runtime, the
  # agents must see a kernel other than the host's, and every check of the runc job must run.
  isolation-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [runsc, kata]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o build/lea ./cmd/lea
      - name: install and register ${{ matrix.runtime }}
        run: tests/integration/install-runtime.sh ${{ matrix.runtime }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: proxy/Containerfile
          tags: lea-proxy:dev
          load: true
          cache-from: type=gha,scope=lea-proxy-dev
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Containerfile
          build-args: LEA_VERSION=dev
          tags: lea:dev
          load: true
          cache-from: type=gha,scope=lea-dev
      - name: AppArmor profile (as lea init loads it)
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - name: make test-isolation on ${{ matrix.runtime }}, every check run
        shell: bash
        env:
          LEA_TEST_RUNTIME: ${{ matrix.runtime }}
        run: |
          make test-isolation 2>&1 | tee isolation.log
          if grep -E '^FAIL |^note: ' isolation.log; then echo "an isolation check failed or was skipped" >&2; exit 1; fi
          for c in "lea-test-proxy keeps the engine's default runtime (runc)" 'a nested container runs' 'AF_ALG socket refused (seccomp)' 'NETLINK_AUDIT socket with high protocol bits refused (seccomp)' 'AF_ALG socket with high family bits refused (seccomp)' '.lockfamily write gets EROFS' 'host facade socket not visible' 'no facade socket in the container' 'sibling lea unreachable directly' 'host port unreachable via host IP' 'public HTTPS works through the proxy' 'the Claude API answers through the proxy' 'nested HTTP between containers is direct' 'an external name does not resolve (example.com)' 'no DNS query from inside lea reached the decoy' "lea doctor: $LEA_TEST_RUNTIME applies lea's seccomp profile"; do
            grep -qxF "ok   $c" isolation.log || { echo "isolation: '$c' did not run" >&2; exit 1; }
          done
          [ "$(grep -c "^ok   lea-test-[0-9a-f]* runs on the $LEA_TEST_RUNTIME runtime\$" isolation.log)" -eq 2 ] || { echo "isolation: the agent containers are not on $LEA_TEST_RUNTIME" >&2; exit 1; }
          grep -q "^ok   a kernel other than the host's" isolation.log || { echo "isolation: the second-kernel check did not run" >&2; exit 1; }
          # lea's bus crosses gVisor (--host-uds=open), not Kata's VM (README, "A second kernel").
          if [ "$LEA_TEST_RUNTIME" = runsc ]; then bus="is reachable"; else bus="is not reachable"; fi
          grep -qx "info lea's bus socket $bus" isolation.log || { echo "isolation: lea's bus socket was expected to be $bus" >&2; exit 1; }
      - name: the runtime's logs, on failure
        if: failure()
        run: |
          docker info --format '{{json .Runtimes}}' || true
          sudo journalctl -u docker --no-pager -n 200 || true
          sudo journalctl --no-pager -n 400 | grep -iE 'kata|runsc|gvisor' || true
  # lea's first run on a machine without images (tests/integration/firstrun.sh): a fresh HOME and
  # XDG_* directories, no lea images, the lox CLI of the checksum-verified lockhub release on
  # PATH behind a recorder; `lea shell -- true` pulls both release images (cosign-verified) and
  # runs no lox command (#300); with locks declared, a second run pulls nothing, still runs no lox
  # command, and says to run `lox run` in another terminal, as lea doctor does. The lox release is
  # 0.10.0 (lox run), LOCKS_LOX_VERSION of config/locks.lock: until lockhub's release is tagged the
  # first step finds no release, every other step is skipped and the job succeeds with a notice.
  firstrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCKHUB_VERSION: "0.10.0"
    steps:
      - name: is lockhub's release there yet
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$LOCKHUB_VERSION" -R DavidGodefroid/lockhub >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::lockhub v$LOCKHUB_VERSION not released yet: first-run integration skipped"
          fi
      - if: steps.release.outputs.released == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: steps.release.outputs.released == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - if: steps.release.outputs.released == 'true'
        run: go build -o build/lea ./cmd/lea
      # cosign 3: lea's release images are signed in the new bundle format, which cosign 2 does
      # not find (lea init would reject them as unsigned).
      - if: steps.release.outputs.released == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: AppArmor profile (as lea init loads it)
        if: steps.release.outputs.released == 'true'
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - name: tests/integration/firstrun.sh
        if: steps.release.outputs.released == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tests/integration/firstrun.sh 2>&1 | tee firstrun.log
          grep -qx 'firstrun: OK' firstrun.log
  # lea update on a Homebrew-shaped install (brew upgrade, never lea's installer), brew upgrade
  # alone, and an install.sh install (#354), with real release images.
  update-brew:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: AppArmor profile (as lea init loads it)
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - name: tests/integration/update-brew.sh
        shell: bash
        run: |
          tests/integration/update-brew.sh 2>&1 | tee update-brew.log
          grep -qx 'update-brew: OK' update-brew.log
  # The real Claude Code (the image's pinned version) with lea's hooks on a fake Messages API, and
  # lea's daemon: usage-limit resume, truncated transcripts, and the phase-3 suspend/resume demo
  # (a suspended agent stopped, resumed by its approval or a message). No secret, no real model.
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Its postinstall links the platform binary, as in image/Containerfile.
      - run: npm install -g "@anthropic-ai/claude-code@$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' image/Containerfile)"
      # The managed-settings tests (#111) write Claude Code's file-based managed settings where
      # it reads them, and remove them after.
      - run: sudo install -d -o "$(id -u)" /etc/claude-code
      - name: the Claude e2e tests, none skipped
        shell: bash
        # Every TestClaude test; the count below is theirs (add one with each new test).
        run: |
          LEA_E2E_CLAUDE="$(command -v claude)" go test -count=1 -run '^TestClaude' -v ./internal/daemon/ 2>&1 | tee claude-e2e.log
          if grep -- '--- SKIP' claude-e2e.log; then echo "a Claude e2e test was skipped" >&2; exit 1; fi
          grep -q -- '^--- PASS: TestClaudePhase3SuspendResumeEndToEnd ' claude-e2e.log
          grep -q -- '^--- PASS: TestClaudeResumesATruncatedTranscript ' claude-e2e.log
          grep -q -- '^--- PASS: TestClaudeManagedSettingsGuardATamperedAgent ' claude-e2e.log
          grep -q -- '^--- PASS: TestClaudeManagedAndFlagHooksRunOnce ' claude-e2e.log
          grep -q -- '^--- PASS: TestClaudeManagedPermissionsIgnoreAWidenedSettings ' claude-e2e.log
          grep -q -- '^--- PASS: TestClaudeManagedHooksIgnoreATamperedEnv ' claude-e2e.log
          grep -q -- '^--- PASS: TestClaudeManagedSettingsKeepClaudeCodesDefaultMode ' claude-e2e.log
          grep -q -- '^--- PASS: TestClaudeWithoutTheDeckAnApprovalIsAnsweredWithLeaApprove ' claude-e2e.log
          grep -q -- '^--- PASS: TestClaudeNestedSessionDoesNotEndTheAgent ' claude-e2e.log
          grep -q -- '^--- PASS: TestClaudeTowerFirstPromptTurnsTheGuardOn ' claude-e2e.log
          n=$(grep -c -- '^--- PASS: TestClaude' claude-e2e.log)
          echo "$n Claude e2e tests passed"
          [ "$n" -eq 18 ]
  # The lockmq / lockfile socket wiring (tests/integration/lockhost.sh, phase 0): the lockmq
  # client of the release image/Containerfile pins (sha256-checked) reaches a console's socket
  # through its volume, as lea wires it, with no host account; outsiders and other uids refused.
  lockhost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: make test-lockhost, every check run
        shell: bash
        run: |
          make test-lockhost 2>&1 | tee lockhost.log
          if grep '^FAIL' lockhost.log; then exit 1; fi
          n=$(grep -c '^ok ' lockhost.log)
          echo "$n lockhost checks passed"
          [ "$n" -eq 9 ]
  # The phase-0 exit demo with real consoles (tests/integration/phase0.sh): an agent in a real lea
  # (lea:dev) calls locksql_status, lockmq_status and lockfile_status, each reaching a running
  # console of the release image/Containerfile pins (cosign-verified) that lockhub's released
  # lox up runs, wired as lea wires it. The two lea images come from the GitHub Actions cache
  # when unchanged.
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o build/lea ./cmd/lea
      # cosign 3: lockfile's release signs its images in the new bundle format, which cosign 2
      # does not find; cosign 3 verifies lockmq's and locksql's signatures too.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: proxy/Containerfile
          tags: lea-proxy:dev
          load: true
          cache-from: type=gha,scope=lea-proxy-dev
          cache-to: type=gha,scope=lea-proxy-dev,mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Containerfile
          build-args: LEA_VERSION=dev
          tags: lea:dev
          load: true
          cache-from: type=gha,scope=lea-dev
          cache-to: type=gha,scope=lea-dev,mode=max
      - name: AppArmor profile (as lea init loads it)
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - name: make test-phase0, every check run, the three status calls on running consoles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make test-phase0 2>&1 | tee phase0.log
          if grep '^FAIL' phase0.log; then exit 1; fi
          for t in locksql lockmq lockfile; do
            grep -qx "ok    lea's agent: ${t}_status reaches the running $t console" phase0.log || { echo "phase0: ${t}_status did not reach a running console" >&2; exit 1; }
          done
          n=$(grep -c '^ok ' phase0.log)
          # The hub-only checks wait for each Lock's first hub-only release: a note until then.
          h=$(grep -c '^note: .* the hub-only check is not run' phase0.log || true)
          echo "$n phase0 checks passed, $h hub-only checks not run yet"
          [ $((n + h)) -eq 40 ]
  # lea#324, the locklog end to end (tests/integration/locklog.sh): an agent in a real lea (lea:dev,
  # LEA_LOCKLOG=1) runs locklog_count, free and masked, then a locklog_unmask that waits on the hub
  # and is approved at lox approve, on a locklog console of the release config/locks.lock pins
  # (cosign-verified) that lockhub's released lox run runs. The lea images come from the GitHub
  # Actions cache phase0 fills when unchanged.
  locklog:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o build/lea ./cmd/lea
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: proxy/Containerfile
          tags: lea-proxy:dev
          load: true
          cache-from: type=gha,scope=lea-proxy-dev
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Containerfile
          build-args: LEA_VERSION=dev
          tags: lea:dev
          load: true
          cache-from: type=gha,scope=lea-dev
      - name: AppArmor profile (as lea init loads it)
        run: |
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=apparmor'; then
            if [ -e /etc/apparmor.d/abi/4.0 ]; then abi=4.0 userns='  userns,'; else abi=3.0 userns=''; fi
            sed -e "s|@ABI@|$abi|" -e "s|^@USERNS@\$|$userns|" apparmor/lea.tmpl | sudo tee /etc/apparmor.d/lea >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/lea
          fi
      - name: make test-locklog, every check run, the masked count and the approved unmask
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make test-locklog 2>&1 | tee locklog.log
          if grep '^FAIL' locklog.log; then exit 1; fi
          grep -qx "ok    lea's agent: locklog_count counts the 3 records, masked, with no ticket" locklog.log
          grep -q "^ok    lea's agent: the approved locklog_unmask gives the one clear value" locklog.log
          n=$(grep -c '^ok ' locklog.log)
          echo "$n locklog checks passed"
          [ "$n" -eq 20 ]
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Containerfile
          push: false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: proxy/Containerfile
          push: false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: image/ctl
          file: image/ctl/Containerfile
          push: false

name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      # This setup mirrors tests/Containerfile.
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git jq openssh-client
      - run: pip install --no-cache-dir shellcheck-py==0.10.0.1
      - run: git clone --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core.git /opt/bats && /opt/bats/install.sh /usr/local
      - uses: actions/checkout@v4
      - run: tests/check.sh
  site:
    # leadeck.dev: the site's unit test, then every page in headless Chrome (light and dark, 1440
    # and 390 px); the screenshots are kept as the run's artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: python3 -m unittest discover -s tests/site -p 'test_*.py' -v
      - run: node tests/site/e2e.mjs
        env:
          SITE_E2E: required
          SCREENSHOTS: site-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: site-screenshots
          path: site-screenshots
  web:
    # lea web (#414): lea web against a test daemon in headless Chrome (tests/web/e2e.mjs): sign-in,
    # the live board, a note, the spawn form, a permission answered in the browser, 375 px.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: go build -o build/lea ./cmd/lea && go build -o build/lea-web-fixture ./tests/web/fixture
      - run: node tests/web/e2e.mjs
        env:
          WEB_E2E: required
          SCREENSHOTS: web-screenshots
      # #416: an agent's terminal, background notifications, folders shared with the deck.
      - run: node tests/web/e2e-416.mjs
        if: always()
        env:
          WEB_E2E: required
          SCREENSHOTS: web-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-screenshots
          path: web-screenshots

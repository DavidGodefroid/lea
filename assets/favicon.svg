<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="lea">
  <title>lea</title>
  <!-- The sealed container: agents live inside, your machine stays outside. -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#1e1e2e"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="#89b4fa" stroke-width="5"/>
  <!-- Three agents side by side, as in the deck: needs you, working, done. -->
  <circle cx="36" cy="40" r="8" fill="#f38ba8"/>
  <rect x="52" y="34" width="44" height="12" rx="6" fill="#cdd6f4"/>
  <circle cx="36" cy="64" r="8" fill="#fab387"/>
  <rect x="52" y="58" width="32" height="12" rx="6" fill="#cdd6f4" opacity=".75"/>
  <circle cx="36" cy="88" r="8" fill="#a6e3a1"/>
  <rect x="52" y="82" width="40" height="12" rx="6" fill="#cdd6f4" opacity=".5"/>
</svg>

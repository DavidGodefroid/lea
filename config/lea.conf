# shellcheck shell=sh
# lea defaults. Override any of them in the user config (~/.config/lea/lea.conf, written by lea init).
LEA_PREFIX=lea
LEA_IMAGE=lea:dev
LEA_PROXY_IMAGE=lea-proxy:dev
# The installer that lea update runs for a release install.
LEA_INSTALL_URL=https://raw.githubusercontent.com/DavidGodefroid/lea/main/install.sh
# git SSH endpoints (host:port, space separated), each reached through its own forwarder of the
# proxy, for example "github.com:22 gitlab.com:22". Empty: git uses HTTPS only, which reaches any
# forge (log in from lea with gh auth login, glab auth login or a git credential).
# LEA_GIT_SSH="github.com:22"
# 1: lea is wired for a locksql console (https://github.com/DavidGodefroid/locksql) running in its
# own container, and lea init builds its image. 0: no trace of locksql.
LEA_LOCKSQL=1
LEA_LOCKSQL_IMAGE=locksql:0.6.0
LEA_LOCKSQL_REF=v0.6.0
# host:port of an OTel collector. Empty disables the OTLP forwarder.
LEA_OTEL_UPSTREAM=
# Podman networks the nested engine creates at start (external networks of your compose files).
LEA_NESTED_NETWORKS=""
LEA_K8S_NAMESPACE=lea

# Permission requests of deck agents: deck (answered with a / d / A in the agent's row; the
# agent's own dialog after LEA_APPROVAL_TIMEOUT seconds, or at once when no terminal shows the
# deck) or pane (the agent's own dialog only). Applies to agents started after `lea stop --all`.
LEA_APPROVALS=deck
LEA_APPROVAL_TIMEOUT=60

# Running agents per projects directory (1-99): lea new, n and a lead's agents_spawn are refused
# beyond it. A lead runs at most 6 agents of its own. Applies after the launcher restarts the daemon.
LEA_MAX_AGENTS=12


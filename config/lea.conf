# shellcheck shell=sh
# lea defaults. Override any of them in the user config (~/.config/lea/lea.conf, written by lea init).
LEA_PREFIX=lea
LEA_IMAGE=lea:dev
LEA_PROXY_IMAGE=lea-proxy:dev
# Where lea update finds the latest release of a release install (/latest) and that release's own
# installer (/download/<version>/install.sh, checked against its checksums.txt).
LEA_RELEASES_URL=https://github.com/DavidGodefroid/lea/releases
# 1: a release install looks for a new release at most once a day, in the background, when lea
# starts; a newer minor or patch release is installed (its signature checked: cosign is needed)
# and becomes active at the next lea, a newer major one is only announced in the deck (in 0.x, a
# newer minor one too: only patch releases install themselves). 0: only
# lea update updates. A git checkout and a dev build never check.
LEA_AUTOUPDATE=1
# A release the background update neither installs nor announces (vX.Y.Z), set by lea rollback
# to the version it rolled back from. Empty: none.
LEA_AUTOUPDATE_SKIP=
# git SSH endpoints (host:port, space separated), each reached through its own forwarder of the
# proxy, for example "github.com:22 gitlab.com:22". Empty: git uses HTTPS only, which reaches any
# forge (log in from lea with gh auth login, glab auth login or a git credential).
# LEA_GIT_SSH="github.com:22"
# Egress allowlist, off by default (any web destination on 80 and 443). Set: only these domains
# and their subdomains (comma separated), plus the model API and its login (anthropic.com,
# claude.ai, claude.com), are reachable on the web; internal hosts are not affected. Applies once
# the proxy restarts (lea stop --all, then lea).
# LEA_EGRESS_ALLOW="github.com,api.github.com,registry.npmjs.org,proxy.golang.org"
# 1: lea is wired for a locksql console (https://github.com/DavidGodefroid/locksql) running in its
# own container, and lea init builds its image. 0: no trace of locksql.
LEA_LOCKSQL=1
LEA_LOCKSQL_IMAGE=locksql:0.8.0
# A release of locksql (vX.Y.Z: its source is built once its signature is verified), or the
# absolute path of a locksql checkout (to try one not released yet).
LEA_LOCKSQL_REF=v0.8.0
# The Vault address the locksql console reads a Vault profile's login from (lea init asks for it).
# LEA_LOCKSQL_VAULT_ADDR=https://vault.example.com
# 1: lea's agents reach a lockmq console (https://github.com/DavidGodefroid/lockmq, RabbitMQ) or a
# lockfile console (https://github.com/DavidGodefroid/lockfile, files) running on this host, in the
# tool's own account and login session (sudo lockmq install / sudo lockfile install). lea mounts
# only the console's socket directory into its containers; it never starts a console. 0 (the
# default, the tools are pre-releases): no trace of them. lea init asks.
LEA_LOCKMQ=0
LEA_LOCKFILE=0
# The release lea pins for each: its client is in lea's image, and lea init installs it on the
# host (cosign-checked). lockfile below v0.1.1 is refused (v0.1.0: plugin sandbox escape).
LEA_LOCKMQ_REF=v0.1.0
LEA_LOCKFILE_REF=v0.2.0
# host:port of an OTel collector. Empty disables the OTLP forwarder.
LEA_OTEL_UPSTREAM=
# Podman networks the nested engine creates at start (external networks of your compose files).
LEA_NESTED_NETWORKS=""
LEA_K8S_NAMESPACE=lea

# The provider of an agent started without one (claude, codex, or a name of LEA_PROVIDERS) and
# its model (empty: the provider's default). Read when the daemon starts.
LEA_PROVIDER=claude
LEA_MODEL=
# Your OpenAI-compatible endpoints (Ollama, vLLM ...), run through Codex: see
# config/providers.example. Empty: ~/.config/lea/providers.
# LEA_PROVIDERS=

# Permission requests of deck agents: deck (answered with a / d / A in the agent's row; the
# agent's own dialog after LEA_APPROVAL_TIMEOUT seconds, or at once when no terminal shows the
# deck) or pane (the agent's own dialog only). Applies to agents started after `lea stop --all`.
LEA_APPROVALS=deck
LEA_APPROVAL_TIMEOUT=60

# Sounds on the host while a deck shows the agent: one when an agent starts waiting for you
# (attention), one when its turn ends (done). LEA_SOUND=0 starts with both off; `lea sound on|off`
# and the deck's S switch them at runtime. LEA_SOUND_ATTENTION and LEA_SOUND_DONE: a sound file
# for that event, or 0 to mute it (empty: the freedesktop sound). Read when the daemon starts
# (after `lea stop --all`).
# LEA_SOUND=1
# LEA_SOUND_ATTENTION=/usr/share/sounds/freedesktop/stereo/message-new-instant.oga
# LEA_SOUND_DONE=0

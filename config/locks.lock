# shellcheck shell=sh disable=SC2034
# The Lock Family releases lea is built and tested with, as one set (lea#134): for each Lock, the
# release of its client in lea's image (image/Containerfile installs it from this file), the
# protocol major its hello handshake speaks, the release's image by digest (what `lox add TYPE
# NAME --version` pins in lockfamily.yaml; variants by their name) and the cosign identity that
# signed it, and its client archives' sha256 (from the release's signed checksums.txt). lox is
# lockhub's host CLI, which installs, starts and approves the Locks: lea never does.
# Never edited by hand: tools/locks-bump rewrites it whole, after cosign checks every pin, and the
# Locks workflow (.github/workflows/locks.yml) opens the pull request. A release ships this file
# as it is, so a lea's clients never mix sets. lea doctor compares each with the lock lox runs.
# A key is LOCKS_<LOCK>_<FIELD>, one per line, KEY=VALUE without quotes.
